[workspace]
resolver = "2"
members = [
    "contracts/escrow",
    "contracts/escrow_v2",
    "contracts/stelo_nft",
]

[workspace.dependencies]
soroban-sdk = "21.7.6"
soroban-token-sdk = "21.7.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
